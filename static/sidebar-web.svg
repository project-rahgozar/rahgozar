<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 720" fill="none">
  <title>Rahgozar route web</title>
  <desc>توری از مسیرهای نورانی رهگذر — فیروزه‌ای و طلایی با ایستگاه‌های تپنده</desc>
  <defs>
    <linearGradient id="wire" x1="35" y1="600" x2="230" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2de6c8" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#2de6c8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f2b544" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="wire2" x1="0" y1="720" x2="260" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5fd7bd" stop-opacity=".12"/>
      <stop offset="1" stop-color="#f2b544" stop-opacity=".5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .nd{transform-box:fill-box;transform-origin:center;animation:np 3.4s ease-in-out infinite}
      .nd:nth-of-type(2){animation-delay:.7s}.nd:nth-of-type(3){animation-delay:1.4s}
      .nd:nth-of-type(4){animation-delay:2.1s}.nd:nth-of-type(5){animation-delay:2.8s}
      @keyframes np{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.5);opacity:1}}
      .dash{stroke-dasharray:3 15;animation:fl 2.4s linear infinite}
      @keyframes fl{to{stroke-dashoffset:-36}}
    </style>
  </defs>
  <g stroke="url(#wire)" stroke-width=".9">
    <path d="M-18 595 55 559 121 515 184 475 278 447M-10 645 59 592 115 554 172 514 266 486M-18 530 51 514 105 484 158 449 270 420M-16 465 45 457 91 430 137 392 255 371M45 559 35 514 51 457 74 403 95 338M121 515 105 484 91 430 95 338 114 262M184 475 158 449 137 392 147 324 166 253M278 447 255 371 232 309 208 249 183 190M-10 645 45 559 105 484 158 449 232 428M-18 530 59 592 121 515 184 475 255 371M51 457 105 484 158 449 208 408 255 371M74 403 137 392 183 420 232 428M95 338 147 324 208 349 255 371M114 262 166 253 208 249 232 309M147 324 183 349 208 408 232 428"/>
  </g>
  <g stroke="url(#wire2)" stroke-width="1.1" class="dash" opacity=".8">
    <path d="M20 700 C70 640 60 560 110 500 C160 440 150 360 200 300 C235 258 240 200 252 150"/>
    <path d="M0 620 C60 600 90 540 130 480 C170 420 230 400 250 340"/>
  </g>
  <g filter="url(#glow)">
    <circle class="nd" cx="110" cy="500" r="5" fill="#2de6c8"/>
    <circle class="nd" cx="200" cy="300" r="4.5" fill="#5fd7bd"/>
    <circle class="nd" cx="252" cy="150" r="6" fill="#f2b544"/>
    <circle class="nd" cx="55" cy="559" r="4" fill="#2de6c8"/>
    <circle class="nd" cx="232" cy="428" r="4" fill="#f2b544"/>
    <circle cx="252" cy="150" r="12" fill="none" stroke="rgba(242,181,68,.5)" stroke-width="1"/>
  </g>
</svg>
