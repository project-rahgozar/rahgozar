<script>
/* تم و زبان قبل از رندر — بدون فلش */
(function(){
  try{
    var t = localStorage.getItem("rahgozar-theme") || localStorage.getItem("rahgozar-theme-v2");
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    var l = localStorage.getItem("rahgozar-lang");
    if (l === "en"){ document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
  }catch(e){}
  try{
    var fx = localStorage.getItem("rahgozar-fx");
    if (fx === "lite") window.rzLite = true;
    else if (fx === "full") window.rzLite = false;
    else window.rzLite = !!((navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 3) ||
                            (navigator.deviceMemory && navigator.deviceMemory <= 2));
  }catch(e){ window.rzLite = false; }
  if (window.rzLite) document.addEventListener("DOMContentLoaded", function(){ document.body.classList.add("rz-lite"); });
})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════
   رهگذر — Sub Nightbook v2 · طراحی کامل از صفر
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg0:#05081a;--bg1:#0a1128;--bg2:#0d1638;
  --card:rgba(16,26,63,.66);--card2:rgba(12,20,48,.8);
  --line:rgba(45,230,200,.22);--line2:rgba(143,232,216,.4);
  --txt:#eef4ff;--txt2:#9fb0d8;--txt3:#5f7396;
  --teal:#2de6c8;--teal2:#8fe8d8;--gold:#f2b544;--gold2:#f2c14e;--indigo:#5b7cf1;
  --ok:#2de6c8;--warn:#f2b544;--bad:#ff5470;
  --r-lg:22px;--r-md:16px;--r-sm:11px;
  --f:"Vazirmatn","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg0:#f6f3ea;--bg1:#efe9db;--bg2:#e9e2cc;
  --card:rgba(255,255,255,.82);--card2:rgba(255,255,255,.94);
  --line:rgba(14,143,120,.25);--line2:rgba(14,143,120,.45);
  --txt:#17356e;--txt2:#5a6a92;--txt3:#8b96b5;
  --teal:#0e8f78;--teal2:#0a5c4c;--gold:#c08a1e;--gold2:#a4711a;--indigo:#4a5fd0;
  color-scheme:light;
}
@property --rz-a{syntax:"<angle>";initial-value:0deg;inherits:false}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--f);color:var(--txt);min-height:100vh;
  background:
    radial-gradient(ellipse 90% 44% at 82% 0%, rgba(91,124,241,.14), transparent 62%),
    radial-gradient(ellipse 80% 40% at 8% 100%, rgba(45,230,200,.10), transparent 58%),
    radial-gradient(ellipse 70% 40% at 100% 92%, rgba(242,181,68,.08), transparent 55%),
    linear-gradient(170deg, var(--bg1), var(--bg0) 60%);
  overflow-x:hidden;padding-bottom:48px;-webkit-font-smoothing:antialiased;
}
[data-theme="light"] body{
  background:
    radial-gradient(ellipse 90% 44% at 82% 0%, rgba(74,95,208,.10), transparent 62%),
    radial-gradient(ellipse 80% 40% at 8% 100%, rgba(14,143,120,.10), transparent 58%),
    linear-gradient(170deg,#faf7ee,#efe9db 62%);
}

/* ── لایه‌های شب ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.aur{position:fixed;inset:-22%;z-index:0;pointer-events:none;filter:blur(3px);opacity:.8;
  background:
    radial-gradient(ellipse 40% 30% at 22% 18%, rgba(45,230,200,.10), transparent 62%),
    radial-gradient(ellipse 44% 34% at 80% 74%, rgba(242,181,68,.08), transparent 60%);
  animation:aur 26s ease-in-out infinite alternate}
@keyframes aur{50%{transform:translate(-2.2%,1.8%) scale(1.05)}100%{transform:translate(2%,-1.6%) scale(1.02)}}
[data-theme="light"] .aur,[data-theme="light"] #stars{opacity:.25}

.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:18px 16px 40px}

/* ── نوار فرمان ── */
.cmdbar{
  position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;margin-bottom:16px;border-radius:18px;
  background:var(--card2);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 14px 40px -18px rgba(2,6,20,.7);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;animation:bf 6s ease-in-out infinite;filter:drop-shadow(0 2px 10px rgba(45,230,200,.3))}
@keyframes bf{50%{transform:translateY(-3.5px)}}
.brand b{font-size:17.5px;font-weight:900;letter-spacing:.5px;white-space:nowrap;
  background:linear-gradient(100deg,var(--teal2),var(--teal) 40%,var(--gold) 80%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
html[dir="ltr"] .brand b{font-family:Inter,sans-serif;letter-spacing:2.5px}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;
  background:rgba(45,230,200,.09);border:1px solid var(--line);color:var(--teal);white-space:nowrap}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:bl 2s infinite}
.pill.off{background:rgba(255,84,112,.09);color:var(--bad);border-color:rgba(255,84,112,.3)}
.pill.off .d{background:var(--bad);box-shadow:0 0 10px var(--bad)}
@keyframes bl{50%{opacity:.35}}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);cursor:pointer;flex:0 0 auto;
  background:var(--card);color:var(--txt2);display:flex;align-items:center;justify-content:center;transition:all .25s}
.ib:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-2px)}
.ib svg{width:18px;height:18px}
.ib:active{transform:scale(.92)}

/* ── کارت سفر (امضای بصری) ── */
.journey{
  position:relative;border-radius:var(--r-lg);padding:24px 22px 18px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(160deg, rgba(45,230,200,.07), rgba(91,124,241,.05) 45%, transparent), var(--card);
  border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  animation:up .7s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.journey::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:conic-gradient(from var(--rz-a),
    rgba(45,230,200,.05) 0deg, rgba(45,230,200,.65) 75deg,
    rgba(242,181,68,.5) 145deg, rgba(45,230,200,.05) 215deg,
    rgba(143,232,216,.4) 300deg, rgba(45,230,200,.05) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:sp 7s linear infinite;pointer-events:none}
@keyframes sp{to{--rz-a:360deg}}
.j-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.j-title{font-size:14px;font-weight:800;color:var(--txt2)}
.j-pct{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
  background:linear-gradient(120deg,var(--teal),var(--gold));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}
.j-route{width:100%;height:86px;display:block;margin:2px 0 6px}
.j-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--txt3);font-weight:700}
.j-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;
  background:var(--card2);border:1px solid var(--line);color:var(--txt2)}
.chip b{color:var(--txt)}

/* ── کاشی‌ها ── */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{
  position:relative;overflow:hidden;border-radius:var(--r-md);padding:14px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), border-color .3s, box-shadow .3s;
  animation:up .7s cubic-bezier(.22,1,.36,1) both}
.tile:nth-child(2){animation-delay:.07s}.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}
.tile:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 14px 34px -14px rgba(45,230,200,.35)}
.tile:active{transform:scale(.97)}
.tile .tl{font-size:11px;color:var(--txt3);font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tile .tl svg{width:13px;height:13px;color:var(--teal)}
.tile .tv{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.5}
.tile .tv small{font-size:11.5px;color:var(--txt3);font-weight:700}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%), rgba(45,230,200,.12), transparent 46%)}
.tile:hover::after{opacity:1}
.copyable .tv::after{content:"⧉";margin-inline-start:7px;font-size:11px;color:var(--teal);opacity:.7}

/* ── هویت + مینی‌کاشی‌ها ── */
.idrow{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;margin-bottom:14px}
@media (max-width:620px){.idrow{grid-template-columns:1fr}}
.idcard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;
  animation:up .7s .07s cubic-bezier(.22,1,.36,1) both;transition:border-color .3s,transform .3s}
.idcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.idcard::after{content:"";position:absolute;inset-inline-end:-26px;top:-26px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,rgba(45,230,200,.14),transparent 70%);pointer-events:none}
.ava{width:52px;height:52px;flex:0 0 auto;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:900;color:#04231c;background:linear-gradient(135deg,var(--teal),#17b394);
  box-shadow:0 8px 22px -8px rgba(45,230,200,.55)}
.id-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.id-lbl{font-size:10.5px;color:var(--txt3);font-weight:800;letter-spacing:.4px}
.id-name{font-size:16.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-chip{align-self:flex-start;font-family:inherit;font-size:10.5px;font-weight:800;color:var(--teal);cursor:pointer;
  background:rgba(45,230,200,.09);border:1px dashed var(--line2);border-radius:999px;padding:4px 11px;transition:all .25s}
.id-chip:hover{background:rgba(45,230,200,.16)}
.id-chip:active{transform:scale(.95)}
.minitiles{display:grid;grid-template-rows:1fr 1fr;gap:10px}
.mini2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--line);animation:up .7s cubic-bezier(.22,1,.36,1) both;transition:border-color .3s}
.mini2:first-child{animation-delay:.12s}.mini2:last-child{animation-delay:.18s}
.mini2:hover{border-color:var(--line2)}
.m-lbl{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt3);font-weight:800}
.m-lbl svg{width:14px;height:14px;color:var(--teal)}
.m-val{font-size:13.5px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
/* ── اپلیکیشن‌های پیشنهادی ── */
.apps{margin-top:16px;animation:up .7s .25s cubic-bezier(.22,1,.36,1) both}
.apps-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ah-ic{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:var(--teal);background:rgba(45,230,200,.1);border:1px solid var(--line)}
.ah-ic svg{width:16px;height:16px}
.apps-h b{font-size:13.5px;font-weight:900}
.ah-line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.apps-g{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px;margin-bottom:10px;
  transition:border-color .3s}
.apps-g:hover{border-color:var(--line2)}
.g-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:var(--txt2);margin-bottom:10px}
.g-head svg{width:16px;height:16px;color:var(--teal)}
.g-head .you{font-style:normal;font-size:9.5px;font-weight:800;color:#04231c;background:linear-gradient(135deg,var(--teal),#17b394);
  border-radius:999px;padding:3px 9px;margin-inline-start:2px}
.g-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.app-c{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:13px;text-decoration:none;
  background:rgba(3,7,22,.35);border:1px solid var(--line);transition:border-color .25s,transform .25s,background .25s}
[data-theme="light"] .app-c{background:#ffffff}
.app-c:hover{border-color:var(--teal);transform:translateY(-2px);background:rgba(45,230,200,.06)}
.app-c img{width:34px;height:34px;border-radius:9px;flex:0 0 auto;box-shadow:0 3px 10px -2px rgba(2,6,20,.6)}
.app-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.app-b b{font-size:12.5px;font-weight:900;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-src{font-size:9.5px;font-weight:800;color:var(--teal);white-space:nowrap}
.app-src.paid{color:#f2b544}
.app-ar{width:13px;height:13px;color:var(--txt3);margin-inline-start:auto;flex:0 0 auto;transition:transform .25s,color .25s}
.app-c:hover .app-ar{transform:translateX(var(--ar-move,-4px));color:var(--teal)}
html[dir="rtl"] .app-ar{transform:scaleX(-1)}
html[dir="rtl"] .app-c:hover .app-ar{transform:scaleX(-1) translateX(-4px)}
.apps-note{font-size:10.5px;color:var(--txt3);line-height:1.9;margin-top:2px}
@media (max-width:480px){.g-row{grid-template-columns:1fr 1fr}.app-b b{font-size:11.5px}}
@media (max-width:340px){.g-row{grid-template-columns:1fr}}

/* ── ساب‌کارت داخل سفر ── */
.subcard{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.subcard .sc-ic{width:17px;height:17px;color:var(--teal);flex:0 0 auto;align-self:center;opacity:.8}
.subcard input{flex:1;min-width:0;direction:ltr;text-align:left;font-size:11.5px;font-family:inherit;color:var(--txt2);
  padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(3,7,22,.35);outline:none}
[data-theme="light"] .subcard input{background:#ffffff}
.subcard input:focus{border-color:var(--line2)}
.subcard .btn{padding:10px 14px;border-radius:12px;font-size:12px}
/* ── ناوبری تمام-عرض ── */
.seg-wide{display:flex;width:100%;gap:6px;padding:6px;border-radius:18px}
.seg-wide button{flex:1;justify-content:center;padding:11px 10px}

/* ── ناوبری سگمنتی ── */
.seg{display:flex;gap:4px;padding:5px;border-radius:16px;margin-bottom:14px;
  background:var(--card2);border:1px solid var(--line);width:fit-content;max-width:100%}
.seg button{
  font-family:inherit;border:0;background:transparent;color:var(--txt2);cursor:pointer;
  font-size:13px;font-weight:800;padding:9px 18px;border-radius:12px;transition:all .3s;display:flex;gap:7px;align-items:center}
.seg button svg{width:15px;height:15px}
.seg button.on{background:linear-gradient(135deg,var(--teal),#17b394);color:#04231c;box-shadow:0 6px 18px -6px rgba(45,230,200,.6)}
.seg button:not(.on):hover{color:var(--txt)}
section.view{display:none}
section.view.on{display:block;animation:view .45s cubic-bezier(.22,1,.36,1)}
@keyframes view{from{opacity:0;transform:translateY(14px)}}

/* ── ساب‌لینک ── */
.sublink{display:flex;gap:8px;margin-bottom:14px;animation:up .7s .1s cubic-bezier(.22,1,.36,1) both}
.sublink input{
  flex:1;min-width:0;direction:ltr;text-align:left;font-size:12.5px;font-family:inherit;color:var(--txt2);
  padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);outline:none;transition:border-color .3s}
.sublink input:focus{border-color:var(--line2)}
.btn{
  font-family:inherit;cursor:pointer;border-radius:14px;font-size:13px;font-weight:800;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;
  border:1px solid var(--line);background:var(--card2);color:var(--txt);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, border-color .3s, filter .3s}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--line2);transform:translateY(-2px)}
.btn:active{transform:scale(.95)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),#e09a2d);color:#241701;border-color:rgba(255,224,150,.4);
  box-shadow:0 8px 24px -8px rgba(242,181,68,.55)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.teal{background:linear-gradient(135deg,var(--teal),#17b394);color:#04231c;border-color:rgba(143,232,216,.45)}

/* ── نوار ابزار کانفیگ‌ها ── */
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools .search{position:relative;flex:1;min-width:170px}
.tools input{width:100%;font-family:inherit;font-size:13px;color:var(--txt);padding:12px 40px 12px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--card2);outline:none;transition:border-color .3s}
.tools input:focus{border-color:var(--line2)}
.tools .search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt3)}
[dir="ltr"] .tools input{padding:12px 14px 12px 40px}

/* ── کارت‌های ایستگاه ── */
.station{
  position:relative;overflow:hidden;border-radius:var(--r-md);padding:13px 15px;margin-bottom:9px;
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), border-color .3s, box-shadow .3s;
  animation:st .5s cubic-bezier(.22,1,.36,1) both}
@keyframes st{from{opacity:0;transform:translateY(16px) scale(.98)}}
.station:hover{transform:translateY(-2.5px);border-color:var(--line2);box-shadow:0 12px 30px -12px rgba(45,230,200,.35)}
.station::before{content:"";position:absolute;inset-inline-start:0;top:14%;bottom:14%;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--teal),var(--gold));opacity:.65}
.st-node{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative}
.st-node i{width:13px;height:13px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#17b394);
  box-shadow:0 0 0 3.5px rgba(45,230,200,.15), 0 0 12px rgba(45,230,200,.5);transition:transform .3s}
.station:hover .st-node i{transform:scale(1.25)}
.st-node::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:16px;
  background:linear-gradient(180deg,rgba(45,230,200,.4),transparent)}
.station:last-of-type .st-node::after{display:none}
@media(hover:hover){
  .station .st-act{opacity:0;transform:translateX(-8px);transition:opacity .3s,transform .3s}
  .station:hover .st-act{opacity:1;transform:none}
}
.st-body{flex:1;min-width:0}
.st-name{font-size:13px;font-weight:800;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.st-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:900;letter-spacing:.6px;padding:3px 8px;border-radius:999px;direction:ltr}
.tag.ws{background:rgba(91,124,241,.13);color:#9db4ff;border:1px solid rgba(91,124,241,.3)}
.tag.reality{background:rgba(242,181,68,.12);color:var(--gold);border:1px solid rgba(242,181,68,.32)}
.tag.grpc,.tag.xhttp{background:rgba(45,230,200,.1);color:var(--teal);border:1px solid var(--line)}
.tag.trojan{background:rgba(255,84,112,.1);color:var(--bad);border:1px solid rgba(255,84,112,.28)}
.st-act{display:flex;gap:6px;flex:0 0 auto}
.mini{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
.mini svg{width:15px;height:15px}
.mini:hover{color:var(--teal);border-color:var(--line2);transform:translateY(-2px)}
.mini:active{transform:scale(.9)}
.empty{padding:44px 20px;text-align:center;color:var(--txt3);font-weight:700;border:1px dashed var(--line);border-radius:var(--r-md)}

/* ── اطلاعات ── */
.kv{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--card)}
.kv .row{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;font-size:13px;border-bottom:1px solid var(--line)}
.kv .row:last-child{border-bottom:0}
.kv .k{color:var(--txt3);font-weight:700}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
[dir="rtl"] .kv .v{text-align:left}

/* ── مودال ── */
.ovl{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(3,6,18,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ovl.on{display:flex;animation:ov .3s ease}
@keyframes ov{from{opacity:0}}
.box{width:min(360px,94vw);border-radius:var(--r-lg);padding:24px;position:relative;text-align:center;
  background:linear-gradient(165deg,rgba(20,32,74,.92),rgba(8,13,34,.96));border:1px solid var(--line2);
  box-shadow:0 30px 80px -20px rgba(2,6,20,.9), 0 0 50px -20px rgba(45,230,200,.4);
  animation:bx .4s cubic-bezier(.22,1,.36,1)}
@keyframes bx{from{opacity:0;transform:translateY(22px) scale(.96)}}
[data-theme="light"] .box{background:linear-gradient(165deg,#ffffff,#f4f0e4)}
.box h3{font-size:15px;font-weight:900;margin-bottom:4px}
.box .sub{font-size:11.5px;color:var(--txt2);margin-bottom:14px;direction:ltr}
#qrImg{width:238px;height:238px;margin:0 auto 12px;border-radius:16px;background:#fff;padding:10px;display:flex;align-items:center;justify-content:center}
#qrImg canvas,#qrImg img{width:100%;height:100%;image-rendering:pixelated}
.qr-wait{color:var(--txt3);font-size:12px;font-weight:700}
.box .close{margin-top:6px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 6px}
.app{display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:13px;cursor:pointer;text-decoration:none;
  background:var(--card2);border:1px solid var(--line);color:var(--txt);font-size:12.5px;font-weight:800;transition:all .25s}
.app:hover{border-color:var(--line2);transform:translateY(-2px)}
.app svg{width:17px;height:17px;color:var(--teal);flex:0 0 auto}

/* ── سوشال + فوتر ── */
.social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 14px}
.social a{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  color:var(--txt2);background:var(--card);border:1px solid var(--line);transition:all .3s}
.social a svg{width:19px;height:19px}
.social a:hover{color:var(--teal);border-color:var(--line2);transform:translateY(-4px);box-shadow:0 12px 26px -12px rgba(45,230,200,.4)}
.foot{text-align:center;font-size:11px;color:var(--txt3);padding-bottom:10px}

#cpTa{width:100%;height:124px;direction:ltr;text-align:left;font-family:ui-monospace,monospace;font-size:11px;line-height:1.7;
  margin:4px 0 10px;border-radius:13px;border:1px solid var(--line);background:rgba(3,7,22,.55);color:var(--txt);padding:10px;resize:none;outline:none}
[data-theme="light"] #cpTa{background:#fff}

/* ── توست ── */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);z-index:80;
  padding:11px 22px;border-radius:999px;font-size:13px;font-weight:800;color:#04231c;
  background:linear-gradient(135deg,var(--teal),#17b394);box-shadow:0 12px 34px -8px rgba(45,230,200,.6);
  transition:transform .45s cubic-bezier(.22,1,.36,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{transform:translateX(-50%) translateY(0)}

.errbig{padding:70px 20px;text-align:center}
.errbig b{font-size:18px;display:block;margin-bottom:8px}
.errbig span{color:var(--txt3);font-size:13px}

@media (max-width:520px){
  .cmdbar{top:6px;padding:8px 10px}
  .pill span.tx{display:none}
  .journey{padding:18px 14px 14px}
  .j-pct{font-size:28px}
  .j-route{height:70px}
}
@media (min-width:1900px){.wrap{max-width:960px}body{zoom:1.05}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

(function(){

  function size(){

    st = []; var n = Math.min(80, Math.round(innerWidth*innerHeight/24000));
    for (var i=0;i<n;i++) st.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.1+.3)*DPR,
      p:Math.random()*6.28,s:.4+Math.random(),d:.2+Math.random()*.3,g:Math.random()<.16});
  }
  size(); addEventListener("resize", size);
  document.addEventListener("visibilitychange", function(){ run = !document.hidden; if (run) requestAnimationFrame(fr); });
  function fr(t){
    if (!run) return;
    if (window.rzLite){ cx.clearRect(0,0,W,H); requestAnimationFrame(fr); return; }
    cx.clearRect(0,0,W,H);
    for (var i=0;i<st.length;i++){
      var s = st[i], tw = .5+.5*Math.sin(t/1000*s.s+s.p);

    }
    cx.globalAlpha = 1;
    if (!comet && t > next) comet = {x:-60*DPR, y:Math.random()*H*.3, vx:(4.2+Math.random()*2.4)*DPR, vy:(1.1+Math.random())*DPR, life:1};

      var ln = 78*DPR, g = cx.createLinearGradient(comet.x,comet.y,comet.x-ln,comet.y-comet.vy*(ln/comet.vx));
      g.addColorStop(0,"rgba(143,232,216,"+Math.max(comet.life,0)+")"); g.addColorStop(1,"rgba(143,232,216,0)");
      cx.strokeStyle = g; cx.lineWidth = 1.4*DPR;
      cx.beginPath(); cx.moveTo(comet.x,comet.y); cx.lineTo(comet.x-ln,comet.y-comet.vy*(ln/comet.vx)); cx.stroke();
      if (comet.life<=0||comet.x>W+80){ comet=null; next=t+9000+Math.random()*9000; }
    }

function copyText(txt, quiet){
  txt = String(txt == null ? "" : txt);
  if (!txt) return;
  function done(){ if (!quiet) toast(T("tCopy")); }
  /* مسیر ۱: همگام داخل gesture — سازگارترین روش (وب‌ویو تلگرام/اندروید/iOS) */
  try{
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0;pointer-events:none";
    document.body.appendChild(ta);
    if (/ipad|iphone|ipod/i.test(navigator.userAgent)){
      var rg = document.createRange(); rg.selectNodeContents(ta);
      var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
      ta.setSelectionRange(0, txt.length);
    } else { ta.focus(); ta.select(); }
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    if (ok){ done(); return; }
  }catch(e){}
  /* مسیر ۲: Clipboard API */
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ manualCopy(txt); });
  } else manualCopy(txt);
}

var uname = location.pathname.split("/").filter(Boolean).pop();
var SUB_URL = "", CFGS = [], USED = 0, TOTAL = 0, EXPIRE_TS = null, CREATED_TS = null, IS_ON = false, META = {};

function protoOf(c){
  var s = (c || "").toLowerCase();
  if (s.indexOf("security=reality") > -1) return "reality";
  if (s.indexOf("trojan") === 0) return "trojan";
  if (s.indexOf("type=xhttp") > -1) return "xhttp";
  if (s.indexOf("type=grpc") > -1) return "grpc";
  return "ws";
}
function nameOf(c, i){
  try{
    var h = (c || "").split("#")[1] || "";
    var nm = decodeURIComponent(h).trim();
    nm = nm.replace(/^rahgozar[-\s]*/i, "");
    if (nm) return nm;
  }catch(e){}
  return (L === "en" ? "Config " : "کانفیگ ") + (i + 1);
}
function fmtB(b){
  b = Number(b) || 0;
  var u = ["B","KB","MB","GB","TB"], i = 0;
  while (b >= 1024 && i < u.length - 1){ b /= 1024; i++; }
  return (i ? b.toFixed(b >= 100 ? 0 : 1) : b) + " " + u[i];
}
function countUp(el, target, suffix){
  var t0 = null, dur = 1100;
  function step(t){
    if (!t0) t0 = t;
    var k = Math.min((t - t0) / dur, 1);
    k = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(target * k) + (suffix || "");
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function renderJourney(){
  var pct = TOTAL > 0 ? Math.min(100, Math.round(USED / TOTAL * 100)) : (USED > 0 ? 100 : 0);
  countUp($("jPct"), pct, "٪");
  var path = $("jrFill"), len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.getBoundingClientRect();
  path.style.transition = "stroke-dashoffset 1.6s cubic-bezier(.22,1,.36,1) .3s";
  path.style.strokeDashoffset = String(len * (1 - pct / 100));
  var car = $("jrCar"), base = $("jrBase"), bl = base.getTotalLength();
  var pt = base.getPointAtLength(bl * pct / 100);
  car.setAttribute("transform", "translate(" + pt.x + "," + pt.y + ")");
  car.style.opacity = "0";
  setTimeout(function(){ car.style.transition = "opacity .8s ease 1.2s"; car.style.opacity = "1"; }, 50);
  $("chUsed").innerHTML = T("used") + ": <b>" + fmtB(USED) + "</b>";
  $("chTotal").innerHTML = T("total") + ": <b>" + (TOTAL > 0 ? fmtB(TOTAL) : T("unlimited")) + "</b>";
}
function dailyAvg(){
  if (!CREATED_TS) return null;
  var days = Math.max(1, (Date.now() - CREATED_TS) / 86400000);
  return fmtB(USED / days);
}
function expText(){
  if (EXPIRE_TS === null) return T("noExpire");
  var ms = EXPIRE_TS - Date.now();
  if (ms <= 0) return T("expired");
  var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
  if (d > 0) return d + " " + T("days") + (h ? " " + h + " " + T("hours") : "");
  if (h > 0) return h + " " + T("hours") + " " + m + " " + T("minutes");
  return m + " " + T("minutes");
}
function renderTiles(){
  var un = META.username || uname || "—";

  $("vExp").textContent = expText();

  $("chExp").innerHTML = T("expLeft") + ": <b>" + expText() + "</b>";
}
function renderKv(){
  var kv = $("kv"); if (!kv) return;
  var rows = [];
  rows.push([T("tUser"), META.username || uname || "—"]);
  rows.push([T("tSid"), META.config_uuid || uname || "—"]);

  rows.push([T("expireDate"), EXPIRE_TS ? new Date(EXPIRE_TS).toLocaleDateString(L === "fa" ? "fa-IR" : "en-US") : T("noExpire")]);

    return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + String(r[1]).replace(/</g, "&lt;") + "</span></div>";
  }).join("");
}
function renderList(){

      '<div class="st-act">' +

      '<button class="mini" data-q title="' + T("btnQr") + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM18 18h3v3h-3z"/></svg></button></div>';
    row.querySelector("[data-c]").addEventListener("click", function(){ copyText(c); });
    row.querySelector("[data-q]").addEventListener("click", function(){ showQR(c, nm); });
    box.appendChild(row);
  });

    var e = document.createElement("div");
    e.className = "empty"; e.textContent = T("noCfg");
    box.appendChild(e);
  }
}

    if (!CFGS.length) CFGS = d.configs;
    USED = Number(d.traffic_used_bytes) || 0;
    TOTAL = Number(d.traffic_limit_bytes) || 0;
    CREATED_TS = d.created_at_ts ? d.created_at_ts * 1000 : null;
    EXPIRE_TS = d.expire_at_ts ? d.expire_at_ts * 1000 : (d.expire_days ? Date.now() + d.expire_days * 86400000 : null);
    IS_ON = d.is_active !== false && d.status === "active";
    META = {
      username: d.username, config_uuid: d.config_uuid,
      maxConn: parseInt(d.max_ip_per_user, 10) || 0,
      usedIps: parseInt(d.used_ips, 10) || 0,
      transport: d.transport_type || d.protocol || "",
      server: d.server || ""
    };
    SUB_URL = location.origin + "/link/" + (d.config_uuid || uname);
    $("subUrl").value = SUB_URL;
    $("idSid").addEventListener("click", function(){ copyText(META.config_uuid || uname); });
    $("stTx").textContent = IS_ON ? T("on") : T("off");
    $("stPill").classList.toggle("off", !IS_ON);
    bindQc();
    renderJourney();
    renderTiles();
    renderKv();
    renderList();
    $("app").style.display = "";
    applyLang();
    setInterval(function(){ renderTiles(); }, 60000);
  })
  .catch(function(){
    applyLang();
    showErr();
  });
