})();

<style>
/* ═══════════ رهگذر — Night Gate v3 (photo backdrop) ═══════════ */
@property --rz-a{syntax:"<angle>";initial-value:0deg;inherits:false}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;
  color:#eef4ff;
  background:#05081a;
  overflow:hidden;
  touch-action:pan-y;
  user-select:none;-webkit-user-select:none;
}
input{user-select:text;-webkit-user-select:text}

/* ── پس‌زمینهٔ تصویری: مسافر شب ── */
.bg{position:fixed;inset:0;z-index:0}
.bg{background:
    radial-gradient(130% 80% at 72% 30%, rgba(45,230,200,.10), transparent 55%),
    radial-gradient(120% 70% at 18% 72%, rgba(91,124,241,.12), transparent 60%),
    linear-gradient(200deg,#0a1233 0%,#060b22 45%,#03071a 100%)}
.bg img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}
/* در گوشه‌های خیلی بلند، تصویر کمی پایین‌تر قاب می‌شود تا مسیر دیده بماند */
@media (max-aspect-ratio:9/16){ .bg img{object-position:38% 55%} }
/* پردهٔ تیره برای خوانایی متن — از بالا ملایم، پایین پررنگ‌تر */
.bg::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 8%, rgba(5,8,26,0) 40%, rgba(5,8,26,.38) 100%),
    linear-gradient(180deg, rgba(5,8,26,.34) 0%, rgba(5,8,26,.30) 42%, rgba(5,8,26,.62) 78%, rgba(5,8,26,.84) 100%)}
/* ستاره‌های ریز متحرک روی تصویر — فقط درحالت کامل */
#sky{position:fixed;inset:0;z-index:1;display:block;opacity:.75}
.aurora{position:fixed;inset:-25%;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:screen;
  background:
    radial-gradient(ellipse 42% 30% at 24% 18%, rgba(45,230,200,.14), transparent 62%),
    radial-gradient(ellipse 46% 34% at 78% 66%, rgba(91,124,241,.10), transparent 60%);
  animation:auroraDrift 26s ease-in-out infinite alternate}
@keyframes auroraDrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-2.5%,2%) scale(1.06)}
  100%{transform:translate(2.5%,-1.8%) scale(1.03)}}

/* مسیر کاروان — پایین صفحه، خیلی ملایم */
.route-wrap{position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:2;pointer-events:none;opacity:.4}
.route-wrap svg{width:100%;height:100%;display:block}
.rz-flow{stroke-dasharray:4 16;animation:flowDash 1.6s linear infinite}
@keyframes flowDash{to{stroke-dashoffset:-40}}

/* ── صحنه و کارت ── */
.scene{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;padding:24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card3d{perspective:1100px;margin:auto;padding:12px}
.glass{
  --mx:50%;--my:42%;
  position:relative;width:min(400px,92vw);
  border-radius:26px;
  padding:34px 30px 26px;
  background:linear-gradient(165deg,rgba(13,21,52,.66),rgba(6,10,28,.78));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 30px 80px -20px rgba(2,6,20,.92), inset 0 1px 0 rgba(255,255,255,.08);
  transform-style:preserve-3d;
  animation:cardIn .9s cubic-bezier(.22,1,.36,1) .1s both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(42px) scale(.94)}}
/* قاب متحرک conic */
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
  background:conic-gradient(from var(--rz-a),
    rgba(45,230,200,0) 0deg, rgba(45,230,200,.85) 60deg,
    rgba(242,181,68,.8) 130deg, rgba(45,230,200,0) 210deg,
    rgba(143,232,216,.5) 290deg, rgba(45,230,200,0) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:spinB 6.5s linear infinite;
  pointer-events:none}
@keyframes spinB{to{--rz-a:360deg}}
/* نورافکن دنبال‌کنندهٔ ماوس */
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx) var(--my), rgba(45,230,200,.13), transparent 45%);
  opacity:0;transition:opacity .45s ease}
.glass:hover::after{opacity:1}

.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px;transform:translateZ(34px)}
.brand svg{width:84px;height:84px;filter:drop-shadow(0 6px 22px rgba(45,230,200,.35));animation:floatY 6s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(1.5deg)}}
.brand h1{
  font-size:42px;font-weight:900;letter-spacing:1px;line-height:1.1;
  background:linear-gradient(100deg,#8fe8d8 0%,#2de6c8 30%,#f2b544 65%,#8fe8d8 100%);
  background-size:280% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:shimmer 7s linear infinite, brandGlow 4.5s ease-in-out infinite}
@keyframes shimmer{to{background-position:280% center}}
@keyframes brandGlow{50%{filter:drop-shadow(0 0 18px rgba(45,230,200,.4))}}
.brand p{font-size:12px;color:#9fb0d8}

.field{position:relative;margin-bottom:14px;transform:translateZ(24px)}
.field .lock{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#5f7396;transition:color .3s}
.field input:focus ~ .lock{color:#2de6c8}
.field input{
  width:100%;padding:14px 46px 14px 16px;border-radius:16px;font-size:14.5px;font-family:inherit;
  color:#eef4ff;
  background:rgba(3,7,22,.62);
  border:1px solid rgba(143,232,216,.2);
  outline:none;transition:border-color .3s, box-shadow .3s, background .3s}
.field input::placeholder{color:#5f7396}
.field input:focus{border-color:rgba(45,230,200,.65);box-shadow:0 0 0 4px rgba(45,230,200,.12), 0 0 22px -6px rgba(45,230,200,.45);background:rgba(3,7,22,.85)}
.field input[dir="ltr"]{direction:ltr;text-align:left}
.dots{display:flex;gap:5px;justify-content:center;min-height:8px;margin:-6px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:#2de6c8;opacity:.25;transform:scale(.6);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.dots i.on{opacity:1;transform:scale(1);box-shadow:0 0 8px rgba(45,230,200,.8)}

.btn{
  position:relative;width:100%;padding:15px;border:0;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:800;color:#241701;
  background:linear-gradient(135deg,#f2c14e 0%,#e09a2d 100%);
  box-shadow:0 10px 30px -8px rgba(242,181,68,.55), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, filter .3s;
  overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-18deg);
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.6),transparent);
  animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-70%}85%,100%{left:135%}}
.btn:hover{filter:brightness(1.06);box-shadow:0 14px 38px -8px rgba(242,181,68,.7)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.75;cursor:wait}
.btn .sp{display:none;width:18px;height:18px;border:2.5px solid rgba(36,23,1,.3);border-top-color:#241701;border-radius:50%;vertical-align:-4px;margin-inline-start:8px;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.err{
  display:none;align-items:center;gap:8px;margin-top:14px;padding:11px 14px;border-radius:13px;font-size:13px;
  color:#ffb4ab;background:rgba(255,84,104,.09);border:1px solid rgba(255,84,104,.3)}
.err.show{display:flex;animation:errIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes errIn{0%{opacity:0;transform:translateY(-8px)}60%{transform:translateY(2px)}100%{opacity:1;transform:none}}
.glass.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.glass.win{animation:win .5s ease forwards}
@keyframes win{40%{transform:scale(1.02)}100%{opacity:0;transform:translateY(-18px) scale(.97);filter:blur(6px)}}

.credit{position:relative;z-index:5;font-size:12px;color:#8b9cc0;letter-spacing:.4px;padding:10px 0 14px;text-shadow:0 1px 8px rgba(3,6,20,.9)}
.credit b:first-child{color:#f2c14e}.credit b:last-child{color:#2de6c8}

/* ── سوییچ زبان ── */
#langToggle{position:fixed;top:18px;inset-inline-end:18px;z-index:9;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:800;letter-spacing:.5px;color:#c6d4f2;
  background:rgba(10,16,40,.55);border:1px solid rgba(45,230,200,.35);border-radius:12px;padding:7px 13px;
  backdrop-filter:blur(10px);transition:all .25s ease}
#langToggle:hover{color:#fff;border-color:rgba(45,230,200,.7);box-shadow:0 0 18px -6px rgba(45,230,200,.5)}
html[dir="ltr"] .brand h1{font-family:Inter,'Segoe UI',sans-serif;letter-spacing:3px}

/* ── ریسپانسیو همه‌سازه ── */
/* موبایل باریک */
@media (max-width:480px){
  .glass{padding:28px 22px 22px}
  .brand h1{font-size:36px}
  .brand svg{width:72px;height:72px}
}
/* گوشی در حالت افقی / صفحه‌های کوتاه */
@media (max-height:600px){
  .route-wrap{display:none}
  .card3d{padding:8px}
  .glass{padding:20px 22px 16px;border-radius:20px}
  .brand{flex-direction:row;gap:14px;margin-bottom:12px}
  .brand svg{width:50px;height:50px}
  .brand h1{font-size:30px}
  .brand p{display:none}
  .field{margin-bottom:10px}
  .field input{padding:11px 44px 11px 14px;font-size:13.5px}
  .dots{min-height:0;margin:-4px 0 10px}
  .btn{padding:12px;font-size:14px}
  .credit{padding:6px 0 10px;font-size:11px}
}
/* نمایشگرهای بزرگ */
@media (min-width:2000px){
  .glass{width:460px;padding:42px 38px 34px}
  .brand h1{font-size:52px}
  .brand svg{width:100px;height:100px}
}
/* حالت سرعت */
body.rz-lite #sky,body.rz-lite .aurora,body.rz-lite .route-wrap{display:none!important}
body.rz-lite .glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:linear-gradient(165deg,rgba(13,21,52,.9),rgba(6,10,28,.95))}
body.rz-lite .glass::before,body.rz-lite .btn::after,body.rz-lite .aurora,body.rz-lite .brand svg,body.rz-lite .brand h1{animation:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #sky,.route-wrap{display:none}
}
</style>
</head>

<script>
"use strict";
/* ── آسمان: ستاره‌ها + شهاب (روی تصویر، خیلی ملایم) ── */
(function(){
  var cv = document.getElementById("sky"), cx = cv.getContext("2d");
  var W, H, stars = [], comet = null, nextComet = 0, mx = .5, my = .5;
  function size(){
    W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio;
    cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
    var n = Math.min(90, Math.round(innerWidth * innerHeight / 18000));
    stars = [];
    for (var i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H * .72,
      r: (Math.random() * 1.2 + .3) * devicePixelRatio,
      p: Math.random() * Math.PI * 2, s: .35 + Math.random() * 1.1,
      d: Math.random() * .5 + .2, hue: Math.random() < .18
    });
  }
  addEventListener("resize", size); size();
  function frame(t){
    if (window.rzLite){ cx.clearRect(0, 0, W, H); requestAnimationFrame(frame); return; }
    cx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++){
      var st = stars[i], tw = .5 + .5 * Math.sin(t / 900 * st.s + st.p);
      cx.globalAlpha = st.d * (.18 + .5 * tw);
      cx.fillStyle = st.hue ? "#ffe9c2" : "#dffcf4";
      cx.beginPath(); cx.arc(st.x, st.y, st.r, 0, 6.284); cx.fill();
    }
    cx.globalAlpha = 1;
    if (!comet && t > nextComet){
      comet = { x: -80, y: Math.random() * H * .3, vx: (5 + Math.random() * 3) * devicePixelRatio, vy: (1.4 + Math.random()) * devicePixelRatio, life: 1 };
    }
    if (comet){
      comet.x += comet.vx; comet.y += comet.vy; comet.life -= .006;
      var tail = 90 * devicePixelRatio;
      var g = cx.createLinearGradient(comet.x, comet.y, comet.x - tail, comet.y - comet.vy * (tail / comet.vx));
      g.addColorStop(0, "rgba(143,232,216," + Math.max(comet.life, 0) + ")");
      g.addColorStop(1, "rgba(143,232,216,0)");
      cx.strokeStyle = g; cx.lineWidth = 1.6 * devicePixelRatio;
      cx.beginPath(); cx.moveTo(comet.x, comet.y); cx.lineTo(comet.x - tail, comet.y - comet.vy * (tail / comet.vx)); cx.stroke();
      if (comet.life <= 0 || comet.x > W + 100){ comet = null; nextComet = t + 5000 + Math.random() * 7000; }
    }
    requestAnimationFrame(frame);
  }
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(frame);
})();

/* ── تیلت سه‌بعدی + نورافکن ── */
(function(){
  var card = document.getElementById("card");
  card.addEventListener("pointermove", function(e){
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    card.style.setProperty("--mx", (px * 100) + "%");
    card.style.setProperty("--my", (py * 100) + "%");
    if (e.pointerType === "mouse"){
      card.style.transform = "rotateY(" + ((px - .5) * 7) + "deg) rotateX(" + ((py - .5) * -7) + "deg)";
    }
  });
  card.addEventListener("pointerleave", function(){ card.style.transform = ""; });
})();

/* ── نقطه‌های رمز ── */
var pw = document.getElementById("pw"), dots = document.getElementById("dots");
function syncDots(){
  while (dots.children.length < pw.value.length){ dots.appendChild(document.createElement("i")); }
  while (dots.children.length > pw.value.length){ dots.removeChild(dots.lastChild); }
  var ch = dots.children;
  for (var i = 0; i < ch.length; i++) ch[i].classList.add("on");
}
pw.addEventListener("input", syncDots);

/* ── آهنگ کوتاه تعاملی ── */
var AC = null;
function tone(notes, type){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume().catch(function(){});
    notes.forEach(function(n){
      var o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + n[1];
      o.type = type; o.frequency.setValueAtTime(n[0], t0);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(.04, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + n[2]);
      o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + n[2] + .02);
    });
  }catch(_){}
}

/* ── ورود ── */
document.getElementById("f").addEventListener("submit", async function(e){
  e.preventDefault();
  var user = document.getElementById("user");
  var card = document.getElementById("card"), btn = document.getElementById("go"), err = document.getElementById("err");
  err.classList.remove("show");
  btn.disabled = true; btn.classList.add("busy");
  try{
    var r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user.value.trim(), password: pw.value })
    });
    if (!r.ok){
      var d = {}; try{ d = await r.json(); }catch(_){ }
      throw new Error(d.detail || (window.__rzFail && __rzFail()) || "ورود ناموفق بود");
    }
    tone([[660, 0, .12], [880, .1, .18]], "sine");
    card.classList.add("win");
    setTimeout(function(){ location.href = "/rahgozar"; }, 320);
  }catch(ex){
    tone([[330, 0, .13], [220, .12, .2]], "triangle");
    document.getElementById("errT").textContent = ex.message || (window.__rzFail && __rzFail()) || "ورود ناموفق بود";
    err.classList.add("show");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    btn.disabled = false; btn.classList.remove("busy");
  }
});
/* اگر مرورگر نام کاربری را پر کرد، فوکوس روی رمز */
addEventListener("load", function(){
  var u = document.getElementById("user");
  if (u && u.value){ document.getElementById("pw").focus(); }
});

/* ── جلوگیری از زوم ناخواسته ── */
document.addEventListener("wheel", function(e){ if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });
document.addEventListener("keydown", function(e){
  if ((e.ctrlKey || e.metaKey) && ["+", "-", "=", "0"].indexOf(e.key) >= 0) e.preventDefault();
});
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
</script>
